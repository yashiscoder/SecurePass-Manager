<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SecurePass</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<svg class="sprite" width="0" height="0" aria-hidden="true">
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M16 7l3 3M14 9l2 2"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
  <symbol id="i-dice" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1"/><circle cx="15.5" cy="15.5" r="1"/><circle cx="15.5" cy="8.5" r="1"/><circle cx="8.5" cy="15.5" r="1"/></symbol>
</svg>

<!-- ============ Sign in / create account ============ -->
<main id="auth-view" class="auth">
  <div class="auth-card">
    <div class="brand"><span class="mark"><svg class="ic"><use href="#i-key"/></svg></span><h1>SecurePass</h1></div>
    <div class="seg2" role="tablist" aria-label="Account">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Sign in</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false">Create account</button>
    </div>
    <form id="auth-form" autocomplete="on" novalidate>
      <label class="lbl" for="a-user">Username</label>
      <input id="a-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label class="lbl" for="a-pass">Master password</label>
      <div class="pw"><input id="a-pass" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="eye" data-eye="a-pass" aria-label="Show password"><svg class="ic"><use href="#i-eye"/></svg></button></div>
      <p class="hint" id="a-hint" hidden>Use at least 8 characters. Your master password can’t be recovered, so keep it somewhere safe.</p>
      <p class="error" id="a-error" role="alert"></p>
      <button class="primary wide" id="a-submit" type="submit">Sign in</button>
    </form>
  </div>
</main>

<!-- ============ Vault ============ -->
<div id="vault-view" hidden>
  <header class="top">
    <div class="wrap row between">
      <div class="brand sm"><span class="mark"><svg class="ic"><use href="#i-key"/></svg></span><strong>SecurePass</strong></div>
      <div class="row gap"><span class="muted" id="who"></span>
        <button type="button" class="btn" id="lock-btn"><svg class="ic"><use href="#i-lock"/></svg>Lock</button></div>
    </div>
  </header>
  <main class="wrap vault">
    <div class="tools">
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="search" placeholder="Search accounts or usernames" aria-label="Search"></label>
      <button type="button" class="primary" id="add-btn"><svg class="ic"><use href="#i-plus"/></svg>Add login</button>
    </div>
    <p class="muted small" id="count" aria-live="polite"></p>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <svg class="ic xl"><use href="#i-lock"/></svg>
      <strong id="empty-title">Your vault is empty</strong>
      <span class="muted" id="empty-sub">Add your first login to get started.</span>
    </div>
  </main>
</div>

<!-- ============ Dialogs ============ -->
<dialog id="dlg-add" aria-labelledby="add-h">
  <form id="add-form" class="dlg" novalidate>
    <h2 id="add-h">Add login</h2>
    <label class="lbl" for="f-account">Account name</label>
    <input id="f-account" placeholder="Gmail, GitHub, Netflix…" autocomplete="off" required>
    <label class="lbl" for="f-user">Username or email</label>
    <input id="f-user" autocomplete="off" autocapitalize="none" spellcheck="false" required>
    <label class="lbl" for="f-pass">Password</label>
    <div class="pw"><input id="f-pass" type="password" autocomplete="new-password" required>
      <button type="button" class="eye" data-eye="f-pass" aria-label="Show password"><svg class="ic"><use href="#i-eye"/></svg></button>
      <button type="button" class="eye" id="f-gen" aria-label="Generate a strong password" title="Generate"><svg class="ic"><use href="#i-dice"/></svg></button></div>
    <div class="meter" id="f-meter" data-level="none"><i></i><i></i><i></i><span id="f-level">Enter a password</span></div>
    <p class="issues" id="f-issues"></p>
    <p class="error" id="f-error" role="alert"></p>
    <div class="row end gap"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="primary">Save login</button></div>
  </form>
</dialog>

<dialog id="dlg-edit" aria-labelledby="edit-h">
  <form id="edit-form" class="dlg" novalidate>
    <h2 id="edit-h">Change password</h2>
    <p class="muted" id="e-label"></p>
    <label class="lbl" for="e-pass">New password</label>
    <div class="pw"><input id="e-pass" type="password" autocomplete="new-password" required>
      <button type="button" class="eye" data-eye="e-pass" aria-label="Show password"><svg class="ic"><use href="#i-eye"/></svg></button>
      <button type="button" class="eye" id="e-gen" aria-label="Generate a strong password" title="Generate"><svg class="ic"><use href="#i-dice"/></svg></button></div>
    <div class="meter" id="e-meter" data-level="none"><i></i><i></i><i></i><span id="e-level">Enter a password</span></div>
    <p class="issues" id="e-issues"></p>
    <p class="error" id="e-error" role="alert"></p>
    <div class="row end gap"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="primary">Update password</button></div>
  </form>
</dialog>

<dialog id="dlg-del" aria-labelledby="del-h">
  <div class="dlg">
    <h2 id="del-h">Delete this login?</h2>
    <p class="muted" id="del-label"></p>
    <div class="row end gap"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="primary danger" id="del-confirm">Delete</button></div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
